<script>
let loaderInterval = null;

// Holt den Key aus dem Speicher oder fragt den Nutzer danach
function getApiKey() {
  let key = localStorage.getItem("CBI_GEMINI_API_KEY");
  if (!key) {
    key = prompt("Bitte gib deinen Gemini API-Key ein:");
    if (key) {
      localStorage.setItem("CBI_GEMINI_API_KEY", key.trim());
    }
  }
  return key;
}

// Funktion zum manuellen Ändern des Keys über den Button
function changeApiKey() {
  const currentKey = localStorage.getItem("CBI_GEMINI_API_KEY") || "";
  const newKey = prompt("Neuen Gemini API-Key eingeben:", currentKey);
  if (newKey !== null && newKey.trim() !== "") {
    localStorage.setItem("CBI_GEMINI_API_KEY", newKey.trim());
    alert("API-Key erfolgreich gespeichert!");
  }
}

function generateDeterministicKey(name) {
  const cleanName = name.toLowerCase().trim();
  if (cleanName.includes('red john')) {
    return '#CBI-REDJOHN';
  }
  let hash = 0;
  for (let i = 0; i < cleanName.length; i++) {
    hash = (hash << 5) - hash + cleanName.charCodeAt(i);
    hash |= 0;
  }
  const positiveHash = Math.abs(hash);
  const number = (positiveHash % 900000) + 100000;
  return `#CBI-${number}`;
}

function startTerminalAnimation(targetName) {
  const terminal = document.getElementById('terminalLoader');
  terminal.style.display = "block";
  terminal.innerHTML = "";

  const logs = [
    `> CONNECTING TO CBI_SACRAMENTO_MAIN...`,
    `> AUTHENTICATING USER_ID #410292... APPROVED.`,
    `> QUERYING DATABASE FOR: "${targetName.toUpperCase()}"...`,
    `> SCANNING DOJ RECORDS [0x88F2A...0x99B3E]`,
    `> CROSS-REFERENCING SACRAMENTO PD FILES...`,
    `> MATCH FOUND. DECRYPTING AKTE...`,
    `> PARSING JSON STRUCTURE...`
  ];

  let step = 0;
  loaderInterval = setInterval(() => {
    if (step < logs.length) {
      const line = document.createElement('div');
      line.className = 'terminal-line';
      line.innerText = logs[step];
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
      step++;
    }
  }, 200);
}

function stopTerminalAnimation() {
  if (loaderInterval) clearInterval(loaderInterval);
  document.getElementById('terminalLoader').style.display = "none";
}

async function searchCBI() {
  const apiKey = getApiKey();
  if (!apiKey) {
    alert("Ohne API-Key kann keine KI-Abfrage durchgeführt werden!");
    return;
  }

  const nameInput = document.getElementById('nameInput');
  const name = nameInput.value.trim();
  const profileCard = document.getElementById('profileCard');
  const errorBox = document.getElementById('errorBox');

  if (!name) {
    alert("Bitte einen Namen eingeben!");
    return;
  }

  profileCard.style.display = "none";
  errorBox.style.display = "none";
  startTerminalAnimation(name);

  const generatedKey = generateDeterministicKey(name);

  const promptText = `Du bist die CBI-Datenbank. Generiere erfundene Passdaten und eine kriminelle Ermittlungsakte im Stil der Serie 'The Mentalist' für das Subjekt: "${name}".
Verwende exakt folgendes Aktenzeichen: "${generatedKey}".
Antworte AUSSCHLIESSLICH als gültiges JSON ohne Markdown-Formatierung:
{
  "aktenzeichen": "${generatedKey}",
  "status": "VERDÄCHTIGER",
  "name": "${name}",
  "geburtsdatum": "14.08.1982",
  "staatsangehoerigkeit": "USA",
  "wohnort": "Sacramento, Kalifornien",
  "familienstand": "Ledig",
  "beruf": "Unbekannt",
  "sicherheitsstufe": "Stufe 2",
  "ermittlungsakte": "Eine potentielle Verbindung zum Fall wird derzeit geprüft."
}`;

  let result = null;

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
    });

    if (response.ok) {
      const data = await response.json();
      let rawText = data.candidates[0].content.parts[0].text;
      rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
      result = JSON.parse(rawText);
    } else {
      console.error("API-Fehler HTTP-Status:", response.status);
    }
  } catch (e) {
    console.warn("API Error / Fallback genutzt:", e);
  }

  stopTerminalAnimation();

  // Fallback, falls der Key falsch ist oder die API fehlschlägt
  if (!result) {
    alert("API-Abfrage fehlgeschlagen. Bitte prüfe deinen API-Key über den Button oben.");
    result = {
      aktenzeichen: generatedKey,
      status: "UNGEPRÜFT",
      name: name,
      geburtsdatum: "Unbekannt",
      staatsangehoerigkeit: "USA",
      wohnort: "Sacramento, CA",
      familienstand: "Unbekannt",
      beruf: "Unbekannt",
      sicherheitsstufe: "Stufe 1",
      ermittlungsakte: "Fehler beim Abrufen der KI-Daten. Bitte API-Key überprüfen."
    };
  }

  result.aktenzeichen = generatedKey;

  document.getElementById('fileId').innerText = `AKTENZEICHEN: ${result.aktenzeichen}`;
  document.getElementById('fileStatus').innerText = `STATUS: ${result.status}`;
  document.getElementById('valName').innerText = result.name;
  document.getElementById('valDob').innerText = result.geburtsdatum;
  document.getElementById('valNat').innerText = result.staatsangehoerigkeit;
  document.getElementById('valLoc').innerText = result.wohnort;
  document.getElementById('valFam').innerText = result.familienstand;
  document.getElementById('valJob').innerText = result.beruf;
  document.getElementById('valSec').innerText = result.sicherheitsstufe;
  document.getElementById('valNotes').innerText = result.ermittlungsakte;

  const archivePayload = {
    title: `${result.name} (${result.status})`,
    content: `=== CLASSIFIED // LEVEL ${result.sicherheitsstufe} ===\n\nPERSONENDATEN:\n- Name: ${result.name}\n- Geburtsdatum: ${result.geburtsdatum}\n- Staatsangehörigkeit: ${result.staatsangehoerigkeit}\n- Wohnort: ${result.wohnort}\n- Familienstand: ${result.familienstand}\n- Beruf: ${result.beruf}\n\nERMITTLUNGSAKTE:\n${result.ermittlungsakte}`
  };

  localStorage.setItem("CBI_FILE_" + result.aktenzeichen.trim(), JSON.stringify(archivePayload));
  profileCard.style.display = "block";
}
</script>
